# Configuration Netlify — build, redirections et en-têtes.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Anciennes adresses du site Adobe Portfolio → nouvelles pages
# (utile si l'ancien domaine est redirigé vers ce site).
[[redirects]]
  from = "/work"
  to = "/projets"
  status = 301
[[redirects]]
  from = "/bande-annonce"
  to = "/projets/bande-annonce"
  status = 301
[[redirects]]
  from = "/clip"
  to = "/projets/clip"
  status = 301
[[redirects]]
  from = "/courts-metrages"
  to = "/projets/courts-metrages"
  status = 301
[[redirects]]
  from = "/publicite-packshots"
  to = "/projets/publicite-packshots"
  status = 301
[[redirects]]
  from = "/interview"
  to = "/projets/interviews-reportage"
  status = 301
[[redirects]]
  from = "/motion-design"
  to = "/projets/motion-design"
  status = 301
[[redirects]]
  from = "/projets-personnels"
  to = "/projets-professionnels"
  status = 301
[[redirects]]
  from = "/reportage"
  to = "/projets/stages"
  status = 301
[[redirects]]
  from = "/mon-experience-professionnelle"
  to = "/experience"
  status = 301

# La photographie est sur le site Evastre Photographie
[[redirects]]
  from = "/photographie"
  to = "https://evamassonportfolio.netlify.app"
  status = 302

# Fichiers versionnés (nom avec empreinte) : cache navigateur d'un an
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# L'interface d'administration ne doit jamais être mise en cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
